<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérificateur - ABSEN - 41176023</title>
<style>
body{font-family:Arial;background:#061a14;color:white;padding:20px;max-width:500px;margin:0 auto}
.input{width:100%;padding:18px;border-radius:12px;border:2px solid #d4c06a;background:#0f2e22;color:white;font-size:22px;text-align:center;letter-spacing:2px;font-weight:900}
.btn{width:100%;padding:16px;border-radius:30px;border:none;background:#d4c06a;color:#0a2214;font-weight:900;font-size:18px;margin-top:12px;cursor:pointer}
.result{margin-top:20px;border-radius:16px;padding:20px;text-align:center;font-size:18px;font-weight:900}
</style>
</head>
<body>
<div style="text-align:center;color:#d4c06a;font-weight:900;font-size:22px">ABSEN - VÉRIFICATEUR</div>
<div style="text-align:center;color:#8ab0a0;font-size:13px;margin:10px 0">Numéro Vendeur: 41176023<br>Tape le CODE client</div>

<input class="input" id="codeInput" placeholder="ABSEN-V-XXXX">
<button class="btn" onclick="verify()">🔍 VÉRIFIER</button>
<div id="result"></div>

<div style="margin-top:30px;background:#12382a;padding:14px;border-radius:12px;border:1px solid #1e5a40">
<div style="color:#d4c06a;font-weight:900;font-size:13px">📋 ENTRÉES DU JOUR - 41176023</div>
<div id="usedList" style="font-size:12px;color:#8ab0a0;margin-top:8px">Aucun</div>
<button onclick="clearAll()" style="margin-top:10px;background:#ff4444;color:white;border:none;padding:8px 14px;border-radius:8px;font-size:11px">Effacer</button>
</div>

<script>
function verify(){
  const code=document.getElementById('codeInput').value.trim().toUpperCase();
  const res=document.getElementById('result');
  if(!code.startsWith('ABSEN')){res.innerHTML='<div class="result" style="background:#ff4444">❌ FAUX CODE</div>';return;}
  const used=localStorage.getItem(code+'_used');
  const data=localStorage.getItem(code);
  if(used){res.innerHTML='<div class="result" style="background:orange;color:black">⚠️ DÉJÀ UTILISÉ</div>';}
  else if(data){
    const j=JSON.parse(data);
    res.innerHTML='<div class="result" style="background:#25D366">✅ VALIDE<br><span style="font-size:14px;font-weight:400">'+j.name+' - '+j.type+'<br>'+code+'</span><br><br><button onclick="markUsed(\''+code+'\')" style="background:white;color:black;padding:12px 24px;border-radius:30px;border:none;font-weight:900">✅ ENTRÉE OK</button></div>';
  } else {
    res.innerHTML='<div class="result" style="background:#d4c06a;color:#0a2214">✅ FORMAT OK<br><span style="font-size:13px">Vérifie paiement WhatsApp 41176023<br><b>'+code+'</b></span><br><br><button onclick="markUsed(\''+code+'\')" style="background:#0a2214;color:#d4c06a;padding:12px 24px;border-radius:30px;border:none;font-weight:900">VALIDER</button></div>';
  }
}
function markUsed(c){localStorage.setItem(c+'_used','1');let list=JSON.parse(localStorage.getItem('used_list')||'[]');list.push(c+' - '+new Date().toLocaleTimeString());localStorage.setItem('used_list',JSON.stringify(list));updateList();alert('✅ '+c+' entré');document.getElementById('result').innerHTML='';document.getElementById('codeInput').value='';}
function updateList(){const list=JSON.parse(localStorage.getItem('used_list')||'[]');document.getElementById('usedList').innerHTML=list.length?list.reverse().join('<br>'):'Aucun';}
function clearAll(){if(confirm('Effacer ?')){localStorage.clear();updateList();}}
updateList();
</script>
</body>
</html>
