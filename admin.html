<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - Paiements ABSEN - 41176023</title>
<style>
body{font-family:Arial;background:#061a14;color:white;padding:15px;max-width:500px;margin:0 auto}
.input{width:100%;padding:16px;border-radius:12px;border:2px solid #d4c06a;background:#0f2e22;color:white;font-size:18px;text-align:center;letter-spacing:1px;font-weight:900;margin:8px 0}
.btn{width:100%;padding:14px;border-radius:30px;border:none;font-weight:900;font-size:16px;margin-top:8px;cursor:pointer}
.card{background:#12382a;border:1px solid #1e5a40;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div style="text-align:center;color:#d4c06a;font-weight:900;font-size:20px">🔐 ADMIN - 41176023</div>
<div style="text-align:center;color:#8ab0a0;font-size:12px;margin:8px 0">Seul toi as ce lien. Marque les codes PAYÉS ici.</div>

<input class="input" id="codeInput" placeholder="Ex: ABSEN-S-VGMA-76">
<input class="input" id="nameInput" placeholder="Nom du client (ex: Samuel)">

<button class="btn" style="background:#25D366;color:white" onclick="markPaid()">✅ MARQUER COMME PAYÉ - 41176023</button>
<button class="btn" style="background:#d4c06a;color:#0a2214" onclick="location.href='verify.html'">Aller à page Vérificateur →</button>

<div style="margin-top:20px">
<div style="color:#d4c06a;font-weight:900;font-size:14px">💰 LISTE DES CODES PAYÉS (<span id="count">0</span>)</div>
<div id="paidList" style="margin-top:10px"></div>
</div>

<script>
function markPaid(){
  const code=document.getElementById('codeInput').value.trim().toUpperCase();
  const name=document.getElementById('nameInput').value.trim();
  if(!code.startsWith('ABSEN')){alert('Code doit commencer par ABSEN');return;}
  if(!name){alert('Mets le nom');return;}
  localStorage.setItem('PAID_'+code, JSON.stringify({name:name, time:new Date().toLocaleString()}));
  let list=JSON.parse(localStorage.getItem('paid_codes')||'[]');
  if(!list.includes(code)) list.push(code);
  localStorage.setItem('paid_codes', JSON.stringify(list));
  alert('✅ '+code+' ('+name+') marqué comme PAYÉ !');
  document.getElementById('codeInput').value=''; document.getElementById('nameInput').value='';
  showList();
}
function showList(){
  const list=JSON.parse(localStorage.getItem('paid_codes')||'[]');
  document.getElementById('count').innerText=list.length;
  let html='';
  list.reverse().forEach(code=>{
    const data=JSON.parse(localStorage.getItem('PAID_'+code)||'{}');
    html+=`<div class="card"><div><div style="font-weight:900;color:#d4c06a">${code}</div><div style="font-size:12px;color:#cde0d6">${data.name||''} - ${data.time||''}</div></div><button onclick="removePaid('${code}')" style="background:#ff4444;color:white;border:none;padding:6px 10px;border-radius:8px;font-size:11px">X</button></div>`;
  });
  document.getElementById('paidList').innerHTML=html||'<div style="color:#8ab0a0;font-size:12px">Aucun paiement encore</div>';
}
function removePaid(code){
  if(!confirm('Supprimer '+code+' ?')) return;
  localStorage.removeItem('PAID_'+code);
  let list=JSON.parse(localStorage.getItem('paid_codes')||'[]');
  list=list.filter(c=>c!==code);
  localStorage.setItem('paid_codes', JSON.stringify(list));
  showList();
}
showList();
</script>
</body>
                                                                                                                           </html>
